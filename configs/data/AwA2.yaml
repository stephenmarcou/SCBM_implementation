# --------------------------
#         Dataset
# --------------------------
defaults:
  - data_defaults # Inherit data_defaults arguments
dataset: 'AwA2' # Name of the dataset
num_classes: 50 # Number of the classes of the target variable
num_concepts: 85 # Number of concepts in dataset (the binary predicate matrix columns).
                 # Only correct for the complete run - an incomplete split reduces it,
                 # and it is read back from the split's info.json / predicate matrix.
num_residuals: 30 # Number of residuals

# --------------------------
#      Split / transforms
# --------------------------
seed: ${seed} # Seed of the CEM-style random image-level 60/20/20 split, taken from the
              # top-level `seed` in configs/config.yaml (override it there, or with seed=<n>).
              # It only has an effect while <data_path>/AwA2/{train,val,test}_split.npz do not
              # yet exist - once written, those files define the split, so changing the seed
              # afterwards does NOT reshuffle it. Delete them to force a new split.
image_size: 224 # Images are Resize(256/224 * image_size) -> CenterCrop(image_size)
augment_data: False # False (CEM default) -> the train split uses the same deterministic
                    # Resize + CenterCrop transform as val/test. True -> RandomResizedCrop
                    # + RandomHorizontalFlip on train only.

# --------------------------
#       Saving outputs
# --------------------------
save_concept_and_residual_channel: false # Whether to save the predicted concepts and residuals for each data point, for post-hoc analysis

# Incomplete dataset parameters
# Incomplete AwA2 splits only reduce the concept matrix - the image split is untouched, so
# complete and incomplete runs see exactly the same images and class labels. They live in
# <data_path>/AwA2/<incomplete_dir>/<folder>/ and are selected with data.pkl_file_dir=<folder>/
# (same config field as CUB). Leave null for the complete 85-concept run.
#
# A set is NOT generated by the run: create it explicitly in a notebook with
# datasets.awa2_dataset.create_custom_incomplete_dataset (pick the concepts to keep by
# name) or create_random_incomplete_dataset_attr_groups / _indiv_attr, then pass the
# folder it returns. incomplete=True with a missing or unset pkl_file_dir is an error, so
# that which concepts are hidden stays a deliberate choice, reusable across runs. The
# top-level remove_attribute_groups / num_attribute_groups_remove /
# ratio_attributes_remove flags are consequently unused for AwA2 - they are arguments to
# those notebook helpers instead.
pkl_file_dir: null # Folder of the incomplete concept set (relative to <data_path>/AwA2/<incomplete_dir>)
