# --------------------------
#         Dataset
# --------------------------

defaults:
  - data_defaults # Inherit data_defaults arguments
dataset: 'synthetic_res_scbm' # Name of the dataset
save_data: false # Whether to save the generated dataset to disk 

save_residual_channel: false
save_concept_and_residual_channel: false # Whether to save the predicted concepts and residuals for each data point, only applicable for synthetic dataset
save_raw_mc_samples: false

# Data generation parameters
alpha: 1.0 # Weight of the observed concept component in the label generation process
beta: 1.0 # Weight of the residual component in the label generation process

task_sparsity_obs: 0.3 # Sparsity of the task weights for observed concepts, i.e. the proportion of observed concepts that are relevant for the task
task_sparsity_hid: 0.5 # Sparsity of the task weights for hidden concepts, i.e. the proportion of hidden concepts that are relevant for the task
rho_cr: 0 # Activation of cross-block correlation in sigma
rho_cc: 1 # Activation of within-block correlation for observed concepts in sigma
rho_rr: 1 # Activation of within-block correlation for hidden concepts in sigma
sigma_x: 0.5 # Standard deviation of the noise in the covariates
latent_rank: 5 # Rank of the latent structure in the covariance of the concept and residual factors, set to 0 to have no latent structure
num_covariates: 100 #1500 # Dimensionality of the covariates (x) for each data point
n_samples: 50000 # Total number of samples in the dataset
train_ratio: 0.6 # Proportion of samples in the training set
val_ratio: 0.2 # Proportion of samples in the validation set, test ratio
obs_dim: 10 #100 # Number of observed concepts for data generation
hid_dim: 5 #25 # Number of residual factors for data generation
num_classes: 2 # Number of classes for the target variable

# Model parameters (not used for data generation, but needed to initialize the model)
num_concepts: 10 #100 # Number of observed concepts (same as obs_dim for data generation)
num_residuals: 5 #25 # Number of residual factors (same as hid_dim for data generation)

experiment_type: null # easy, medium, hard
# Easy experiment 

# Data directory path
data_dir_name: null 

