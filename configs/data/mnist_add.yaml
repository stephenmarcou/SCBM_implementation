# -------------------------------------------------
#  Exact-digit MNIST addition covariance experiment
# -------------------------------------------------
defaults:
  - data_defaults

# Keep this value if your current utils/data.py already routes MNIST-Add-Cov to
# the MNIST dataset loader. The accompanying Python file deliberately preserves
# the old get/save/load function names for minimal integration changes.
dataset: 'MNIST-Add-Cov'

# This dedicated data script contains ONLY this experiment:
#   input:    two MNIST digits d1,d2 stacked as [2,28,28]
#   concepts: [d1>=5, d1 prime, d1 even, d2>=5, d2 prime, d2 even]
#   missing:  exact identities d1,d2 (oracle metadata only; never supervised)
#   target:   y = d1 + d2, giving classes 0,...,18
experiment: 'exact_digit_sum'

# -------------------------------------------------
#                 Dataset dimensions
# -------------------------------------------------
num_classes: 19
num_concepts: 6

# Residual variables are binary in Residual-SCBM. Two bits are the minimum
# worst-case capacity here: after conditioning on the six observed concepts,
# some cells still admit four different sums.
num_residuals: 2

# One image channel per digit.
num_covariates: 2

# Use >=5 rather than >=6. >=5 is a balanced 5/5 split over MNIST digits and
# still leaves the intended ambiguity:
#   {0,4}, {5,7}, {6,8}
# have identical [>=5, prime, even] codes within each pair.
digit_threshold: 5

# -------------------------------------------------
#                   Dataset sizes
# -------------------------------------------------
# Each size is divisible by 100, so every ordered digit pair occurs equally
# often within each generated split.
train_dataset_size: 12000
val_dataset_size: 2400
test_dataset_size: 10000
val_percent: 0.2

# Set to an integer (e.g. 42) if you want every training seed to use the exact
# same generated samples. Leave null to keep your current behavior where the
# data split follows the run seed.
data_seed: null

# -------------------------------------------------
#                 Materialised splits
# -------------------------------------------------
save_data: false
save_data_name: null
data_dir_name: null

# The six coarse concepts are all intentionally exposed. Concept incompleteness
# comes from withholding exact digit identity, not by deleting these concepts.
removed_concepts: []

# -------------------------------------------------
#                   Image corruption
# -------------------------------------------------
# Clean images, train and test alike.
#
# Note what this costs: Sigma(x) is amortized from the image, so on perfectly
# readable MNIST the concept posteriors sharpen, the Sigma diagonal collapses
# toward zero, and the concept-residual cross-block Sigma[0:6, 6:8] becomes a
# 0/0 ratio with little to read off. Check Sigma[A,A] is comfortably above zero
# before interpreting any cross-block entry.
#
# To reintroduce uncertainty, set corruption/test_corruption back to 'gaussian'
# with strength 0.5. Keep corruption_channels: 'all' whenever they are non-zero --
# corrupting only digit 1 would make "digit 1 couples to the residual more than
# digit 2" an artifact of which channel got noised.
corruption: 'none'
corruption_strength: 0.0
corruption_probability: 1.0
corruption_channels: 'all'

test_corruption: 'none'
test_corruption_strength: 0.0
test_corruption_probability: 1.0

# -------------------------------------------------
#                   Saving outputs
# -------------------------------------------------
save_predicted_concepts_residuals: false
save_residual_channel: false
save_concept_and_residual_channel: true
