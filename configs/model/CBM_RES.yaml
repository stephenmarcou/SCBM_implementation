defaults:
  - model_defaults # Inherit model_defaults arguments

# --------------------------
#         Model
# --------------------------
model: 'cbm_residual' # Model's name (hard CBM + independent residual channel)
tag: 'baseline' # Model's tag for wandb logging
concept_learning: 'hard' # CBMResidual samples hard concepts {0,1}; 'soft' is not implemented for this model
training_mode: 'joint' # CBMResidual only supports ['joint', 'sequential']

# Residual channel
# The number of residual dimensions is taken from data.num_residuals.
# The residual pathway has its own encoder (deepcopy of the concept encoder),
# its own linear predictor and its own linear task head. It never sees the
# concepts, is not sampled, and is trained through the task loss only.

# --------------------------
#         Policy
# --------------------------
inter_policy: 'random,prob_unc' # Comma-separated intervention policies to determine which concept to intervene. Combinable options: ['random','prob_unc']
inter_strategy: 'simple_perc,emp_perc' # Comma-separated intervention strategies to determine how to perform interventions. Automatically set to 'hard' if using hard CBM ['simple_perc', 'emp_perc']