defaults: 
  - model_defaults # Inherit model_defaults arguments


# --------------------------
#         Model
# --------------------------
model: 'scbm_residual' # Model's name   
tag: 'scbm' # Model's tag for wandb logging
concept_learning: 'hard' # Characteristics of concept bottleneck, either hard {0,1}, or soft logits ['hard', 'soft']. Note that we never explored the soft variant.


# Covariance
cov_type: 'amortized' # Covariance specification. Amortized & global as defined in paper, empirical computes the empirical covariance of the training set and fixes it  ['amortized', 'global', 'empirical']
reg_precision: 'l1' # Regularization strategy of covariance ['l1', None]
reg_weight: 1 # Regularization strength if reg_precision is not None

# --------------------------
#         Policy
# --------------------------
#inter_policy: 'random,prob_unc' # Comma-separated intervention policies to determine which concept to intervene. Combinable options: ['random','prob_unc']
#inter_strategy: 'conf_interval_optimal' # Comma-separated intervention strategies to determine how to perform interventions. Combinable options: ['simple_perc', 'emp_perc', 'conf_interval_optimal']
#inter_policy: 'random' # Intervention policy for L_int_extension_loss if use_L_int_extension_loss is True
inter_strategy: 'emp_perc' # Intervention strategy for L_int_extension_loss if use_L_int_extension_loss is True

level: 0.99 # Confidence level for confidence interval based intervention strategy

# --------------------------
#         Loss
# --------------------------
use_L_int_loss: False # Whether to use the L_int loss as defined in the paper [True, False]
L_int_loss_weight: 1 # Weight of the L_int loss if use_L_int_loss is True
use_L_int_extension_loss: False # Whether to use the L_int extension loss as defined in the paper [True, False] 
L_int_extension_loss_weight: 1 # Weight of the L_int extension loss if use_L_int_extension_loss is True
